services:
  docling-serve:
    image: quay.io/docling-project/docling-serve
    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # Maps their custom local path to the container's expected internal path
      - ${DOCLING_SERVE_ARTIFACTS_PATH}:/app/models
    environment:
      # Forces the container's internal process to look at the mounted volume
      - DOCLING_SERVE_ARTIFACTS_PATH=/app/models      
      - DOCLING_SERVE_ENABLE_UI=1
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 20

