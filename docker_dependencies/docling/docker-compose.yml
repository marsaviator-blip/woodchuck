services:
  docling-serve:
    image: quay.io/docling-project/docling-serve
    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # Maps their custom local path to the container's expected internal path
      - ${DOCLING_SERVE_ARTIFACTS_PATH:-/dev/null}:/opt/app-root/src/models
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      # If variable is empty, it clears the override so Docling defaults to its internal cache/internet download
      - DOCLING_SERVE_ARTIFACTS_PATH=${DOCLING_SERVE_ARTIFACTS_PATH:+/opt/app-root/src/models}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 20

