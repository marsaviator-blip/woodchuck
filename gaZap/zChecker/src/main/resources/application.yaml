spring:
  application:
    name: zChecker
  main:
    web-application-type: servlet
  docker:
    compose:
      readiness:
        timeout: 5m
      enabled: true
      file: ../../docker_dependencies/compose.yml
  ai:
    model:
      chat: google-genai
      embedding:
        text: none
    google:
      genai:
        # Provide an API key to automatically toggle on the Gemini Developer API
        api-key: ${GEMINI_API_KEY} 
        # Alternatively, provide a JSON path for enterprise Vertex AI deployments
        # credentials-uri: "file:/path/to/your/google-credentials.json"
        chat:
          options:
            model: gemini-2.5-flash # Or gemini-2.5-pro
            thinking-level: MEDIUM # Configures deep analysis thresholds
        embedding:
          enabled: false
    vectorstore:
      neo4j:
        initialize-schema: true
        index-name: spring-ai-document-index
        label: Document
        embedding-property: embedding
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

# Neo4j Connection Details
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j

server:
  port: 8089 # Port for your REST API
  connection-timeout: 60000
  ssl:
    enabled: false # Set to true if you want to enable SSL
