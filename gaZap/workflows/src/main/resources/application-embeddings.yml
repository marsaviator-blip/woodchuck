spring:
  ai:
    ollama:
      embedding:
        options:
          model: none
    openai:
      api-key: ${NOMIC_API_KEY} # Or your Hugging Face token
      base-url: https://api-atlas.nomic.ai # Example endpoint
      embedding:
        model: nomic-embed-text-v1.5

crossref:
  api:
    # Forces any client building connections to use Crossref's Polite Pool
    contact-email: ${CROSSREF_CONTACT_EMAIL}
    base-url: https://crossref.org
