version: '3.8'

services:
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: kms-cache-dragonfly
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1

  postgres:
    image: 'postgres:16-alpine'
    container_name: kms-db-postgres
    environment:
      POSTGRES_USER: kms_admin
      POSTGRES_PASSWORD: safe_password_2026
      POSTGRES_DB: kms_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: 'minio/minio'
    container_name: kms-store-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: safe_storage_2026
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  ollama:
    image: ollama/ollama
    container_name: kms-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  miniodata:
  ollama:
